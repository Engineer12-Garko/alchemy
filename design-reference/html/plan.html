<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* reference only */
body{margin:0}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
@media (max-width:820px){.side{display:none!important}.main{padding:28px 20px!important}}
</style>
</head>
<body>



<div style="display:flex;min-height:860px;background:#f7f9f8;font-family:'Manrope',system-ui,sans-serif;color:#14201c">
<aside class="side" style="width:248px;flex:none;box-sizing:border-box;background:#fff;border-right:1px solid #e6ebe9;padding:24px 16px;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;align-items:center;gap:12px;padding:0 8px"><div style="width:36px;height:36px;border-radius:10px;background:#0b5d4e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800">A</div><div style="font-weight:700;font-size:16px">Alchemy</div></div>
<nav style="display:flex;flex-direction:column;gap:4px">
<a href="#" style="display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;font-size:15px;color:#4b5a55;font-weight:600">Home</a>
<a href="#" style="display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;font-size:15px;color:#4b5a55;font-weight:600">AI Tutor</a>
<a href="#" style="display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;font-size:15px;color:#4b5a55;font-weight:600">Practice</a>
<a href="#" style="display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;font-size:15px;background:#e4f1ed;color:#0b5d4e;font-weight:700">Plan</a>
<a href="#" style="display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;font-size:15px;color:#4b5a55;font-weight:600">Progress</a>
</nav>
<div style="margin-top:auto;display:flex;align-items:center;gap:12px;padding:10px 8px;border-top:1px solid #e6ebe9"><div style="width:36px;height:36px;border-radius:50%;background:#14201c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">G</div><div style="font-size:14px;font-weight:600;color:#4b5a55">Account</div></div>
</aside>
<main class="main" style="flex:1;box-sizing:border-box;padding:56px 64px;display:flex;flex-direction:column;gap:28px;max-width:900px">

<header style="display:flex;flex-direction:column;gap:8px"><h1 style="margin:0;font-size:32px;font-weight:800;letter-spacing:-0.02em">Plan</h1><p style="margin:0;font-size:16px;color:#55645f">Add a study session. Keep it small.</p></header>
<div style="display:flex;gap:12px;flex-wrap:wrap"><input aria-label="What will you study" placeholder="What will you study?" style="height:52px;box-sizing:border-box;border:1px solid #d5dedb;border-radius:12px;padding:0 16px;font:inherit;font-size:16px;background:#fff;color:#14201c;flex:1 1 260px;min-width:0"><input aria-label="When" placeholder="When" style="height:52px;box-sizing:border-box;border:1px solid #d5dedb;border-radius:12px;padding:0 16px;font:inherit;font-size:16px;background:#fff;color:#14201c;width:180px"><input aria-label="Minutes" value="30 min" style="height:52px;box-sizing:border-box;border:1px solid #d5dedb;border-radius:12px;padding:0 16px;font:inherit;font-size:16px;background:#fff;color:#14201c;width:110px"><button style="height:52px;padding:0 28px;border:0;border-radius:14px;background:#0b5d4e;color:#fff;font:inherit;font-size:16px;font-weight:700">Add</button></div>
<section style="border:1.5px dashed #c5d1cd;border-radius:20px;padding:56px 28px;text-align:center;display:flex;flex-direction:column;gap:8px"><h2 style="margin:0;font-size:20px;font-weight:700">No sessions yet</h2><p style="margin:0;font-size:16px;color:#55645f">Your upcoming sessions will show up here, soonest first.</p></section>
</main>
</div>
</body>
</html>
