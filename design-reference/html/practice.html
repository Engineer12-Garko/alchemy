<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* reference only */
body{margin:0}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
@media (max-width:820px){.side{display:none!important}.main{padding:28px 20px!important}}
</style>
</head>
<body>



<div style="display:flex;min-height:860px;background:#f7f9f8;font-family:'Manrope',system-ui,sans-serif;color:#14201c">
<aside class="side" style="width:248px;flex:none;box-sizing:border-box;background:#fff;border-right:1px solid #e6ebe9;padding:24px 16px;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;align-items:center;gap:12px;padding:0 8px"><div style="width:36px;height:36px;border-radius:10px;background:#0b5d4e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800">A</div><div style="font-weight:700;font-size:16px">Alchemy</div></div>
<nav style="display:flex;flex-direction:column;gap:4px">
<a href="#" style="display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;font-size:15px;color:#4b5a55;font-weight:600">Home</a>
<a href="#" style="display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;font-size:15px;color:#4b5a55;font-weight:600">AI Tutor</a>
<a href="#" style="display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;font-size:15px;background:#e4f1ed;color:#0b5d4e;font-weight:700">Practice</a>
<a href="#" style="display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;font-size:15px;color:#4b5a55;font-weight:600">Plan</a>
<a href="#" style="display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;font-size:15px;color:#4b5a55;font-weight:600">Progress</a>
</nav>
<div style="margin-top:auto;display:flex;align-items:center;gap:12px;padding:10px 8px;border-top:1px solid #e6ebe9"><div style="width:36px;height:36px;border-radius:50%;background:#14201c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">G</div><div style="font-size:14px;font-weight:600;color:#4b5a55">Account</div></div>
</aside>
<main class="main" style="flex:1;box-sizing:border-box;padding:56px 64px;display:flex;flex-direction:column;gap:28px;max-width:900px">

<header style="display:flex;flex-direction:column;gap:8px"><h1 style="margin:0;font-size:32px;font-weight:800;letter-spacing:-0.02em">Practice</h1><p style="margin:0;font-size:16px;color:#55645f">One question at a time, with clear feedback.</p></header>
<div style="display:flex;gap:12px"><input aria-label="Topic" placeholder="Topic, e.g. chain rule" style="height:52px;box-sizing:border-box;border:1px solid #d5dedb;border-radius:12px;padding:0 16px;font:inherit;font-size:16px;background:#fff;color:#14201c;flex:1;min-width:0"><button style="height:52px;padding:0 28px;border:0;border-radius:14px;background:#0b5d4e;color:#fff;font:inherit;font-size:16px;font-weight:700">New question</button></div>
<section style="background:#fff;border:1px solid #e1e8e5;border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:20px">
<span style="align-self:flex-start;background:#e4f1ed;color:#0b5d4e;font-size:14px;font-weight:700;padding:6px 14px;border-radius:16px">Multivariable chain rule</span>
<p style="margin:0;font-size:19px;line-height:1.55">Let z = x² + y², x = s cos(t), y = s sin(t). Find ∂z/∂s at s = 1, t = 0.</p>
<input aria-label="Your answer" placeholder="Your answer" style="height:52px;box-sizing:border-box;border:1px solid #d5dedb;border-radius:12px;padding:0 16px;font:inherit;font-size:16px;background:#fff;color:#14201c">
<div style="display:flex;justify-content:space-between;align-items:center"><a href="#" style="color:#0b5d4e;font-weight:600;font-size:15px">+ Show my working</a><button style="height:52px;padding:0 28px;border:0;border-radius:14px;background:#0b5d4e;color:#fff;font:inherit;font-size:16px;font-weight:700">Check answer</button></div>
</section>
<a href="#" style="color:#0b5d4e;font-weight:600;font-size:15px">Not sure where to start? Find my gaps →</a>
</main>
</div>
</body>
</html>
