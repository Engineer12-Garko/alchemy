<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Tutor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* reference only */
body{margin:0}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
@media (max-width:820px){.side{display:none!important}.main{padding:28px 20px!important}}
</style>
</head>
<body>



<div style="display:flex;min-height:860px;background:#f7f9f8;font-family:'Manrope',system-ui,sans-serif;color:#14201c">
<aside class="side" style="width:248px;flex:none;box-sizing:border-box;background:#fff;border-right:1px solid #e6ebe9;padding:24px 16px;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;align-items:center;gap:12px;padding:0 8px"><div style="width:36px;height:36px;border-radius:10px;background:#0b5d4e;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800">A</div><div style="font-weight:700;font-size:16px">Alchemy</div></div>
<nav style="display:flex;flex-direction:column;gap:4px">
<a href="#" style="display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;font-size:15px;color:#4b5a55;font-weight:600">Home</a>
<a href="#" style="display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;font-size:15px;background:#e4f1ed;color:#0b5d4e;font-weight:700">AI Tutor</a>
<a href="#" style="display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;font-size:15px;color:#4b5a55;font-weight:600">Practice</a>
<a href="#" style="display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;font-size:15px;color:#4b5a55;font-weight:600">Plan</a>
<a href="#" style="display:flex;align-items:center;height:44px;padding:0 14px;border-radius:10px;font-size:15px;color:#4b5a55;font-weight:600">Progress</a>
</nav>
<div style="margin-top:auto;display:flex;align-items:center;gap:12px;padding:10px 8px;border-top:1px solid #e6ebe9"><div style="width:36px;height:36px;border-radius:50%;background:#14201c;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px">G</div><div style="font-size:14px;font-weight:600;color:#4b5a55">Account</div></div>
</aside>
<main class="main" style="flex:1;box-sizing:border-box;padding:56px 64px;display:flex;flex-direction:column;gap:28px;max-width:900px">

<header style="display:flex;justify-content:space-between;align-items:center;gap:16px"><h1 style="margin:0;font-size:32px;font-weight:800;letter-spacing:-0.02em">AI Tutor</h1><button style="height:44px;padding:0 18px;border:1px solid #d5dedb;border-radius:22px;background:#fff;color:#14201c;font-size:15px;font-weight:600">Source: none ▾</button></header>
<section style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px;min-height:360px">
<h2 style="margin:0;font-size:26px;font-weight:800">What would you like to understand?</h2>
<p style="margin:0;font-size:16px;color:#55645f">Ask anything, or pick a source to ground the answer.</p>
<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px"><button style="height:44px;padding:0 18px;border:1px solid #d5dedb;border-radius:22px;background:#fff;color:#14201c;font-size:15px;font-weight:600">Explain simply</button><button style="height:44px;padding:0 18px;border:1px solid #d5dedb;border-radius:22px;background:#fff;color:#14201c;font-size:15px;font-weight:600">Worked example</button><button style="height:44px;padding:0 18px;border:1px solid #d5dedb;border-radius:22px;background:#fff;color:#14201c;font-size:15px;font-weight:600">Give me a hint</button><button style="height:44px;padding:0 18px;border:1px solid #d5dedb;border-radius:22px;background:#fff;color:#14201c;font-size:15px;font-weight:600">Test me</button></div>
</section>
<div style="display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #d5dedb;border-radius:18px;padding:10px 10px 10px 20px"><input aria-label="Ask the tutor" placeholder="Ask the tutor…" style="flex:1;border:0;outline:0;font:inherit;font-size:16px;height:44px;min-width:0"><button style="height:52px;padding:0 28px;border:0;border-radius:14px;background:#0b5d4e;color:#fff;font:inherit;font-size:16px;font-weight:700;height:44px;padding:0 22px">Send</button></div>
</main>
</div>

</html>
